name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: supportiq
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supportiq_test
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U supportiq -d supportiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://supportiq:ci-only-password@127.0.0.1:5433/supportiq_unused
      TEST_DATABASE_URL: postgresql://supportiq:ci-only-password@127.0.0.1:5433/supportiq_test
      CSRF_SECRET: ci-only-secret-at-least-32-characters-long
      APP_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:test:prepare
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:api
      - run: pnpm test:web
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

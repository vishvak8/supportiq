name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: supportiq
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supportiq_test
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U supportiq -d supportiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://supportiq:ci-only-password@127.0.0.1:5433/supportiq_unused
      TEST_DATABASE_URL: postgresql://supportiq:ci-only-password@127.0.0.1:5433/supportiq_test
      CSRF_SECRET: ci-only-secret-at-least-32-characters-long
      APP_ORIGIN: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_FROM: SupportIQ <support@localhost>
      MINIO_ROOT_USER: supportiq-ci
      MINIO_ROOT_PASSWORD: ci-only-storage-password
      STORAGE_ENDPOINT: http://127.0.0.1:9100
      STORAGE_BUCKET: supportiq-private
      STORAGE_REGION: us-east-1
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build local S3-compatible storage image
        run: docker build -t supportiq-minio:ci -f infra/minio.Dockerfile infra
      - name: Start local S3-compatible storage
        run: |
          docker run -d --name supportiq-minio -p 9100:9000 \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            supportiq-minio:ci server /data --console-address :9001
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9100/minio/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs supportiq-minio
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:test:prepare
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @supportiq/web exec next typegen
      - run: pnpm typecheck
      - run: pnpm test:api
      - run: pnpm test:web
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
